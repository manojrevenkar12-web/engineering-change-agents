[project]
name = "eca"
version = "1.0.0"
description = "Engineering change impact analysis with LangGraph agents over MCP servers, a calibrated crash surrogate, and checkable architecture standards"
requires-python = ">=3.12"
dependencies = ["langgraph>=1.0", "mcp>=2.0", "pydantic>=2.6", "numpy>=1.26", "scikit-learn>=1.4", "fastapi>=0.110",
                "httpx>=0.27", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
eca = "eca.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
src = ["src"]
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E731", "SIM105", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_world.py" = ["E501"]
